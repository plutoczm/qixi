[project]
name = "xunqi"
version = "0.9.0"
description = "Local read-only hotel quote browser"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
markers = ["live: explicitly enabled real provider checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
